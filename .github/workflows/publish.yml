name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The committed .env carries this developer's local ejected-store path
  # (see .env, and _handle_ejected_symlink in discovery.py). load_dotenv()
  # never overrides an already-set env var, so pinning this here keeps CI
  # on the safe in-repo default instead of trying to mkdir a path that only
  # exists on that one machine.
  TA_EJECT_TASKS: "false"

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Several tests create real git repos (auto-commit, store migration)
      # and need a committer identity; the runner has none by default.
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@task-agent.invalid"

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Debug eject env
        run: |
          echo "shell TA_EJECT_TASKS=$TA_EJECT_TASKS"
          uv run python -c "import os; print('python TA_EJECT_TASKS=', repr(os.environ.get('TA_EJECT_TASKS')))"
          cat .env

      - name: Run test suite
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
